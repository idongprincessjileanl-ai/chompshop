# Load balancer in front of the Chomp Shop app containers.
# Spreads traffic over every "app" container, skips unhealthy ones, and rate-limits per visitor IP.

limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream chomshop {
    least_conn;                                   # send each request to the least busy app
    server app:3000 max_fails=3 fail_timeout=10s; # Docker DNS returns every app replica
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;      # proof-of-delivery photos
    limit_conn perip 50;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # If one app container fails, retry the request on another (safe methods only)
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://chomshop;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://chomshop;
    }

    location / {
        proxy_pass http://chomshop;
    }
}
